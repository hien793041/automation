[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "rok-bot-engine"
version = "2.0.0"
description = "ROK Bot Engine v2 - Accuracy-First Humanization Bot"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "rokbot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Vision
opencv-python = "^4.8.1"
ultralytics = "^8.0.0"
paddleocr = "^2.7.0"
paddlepaddle = "^2.5.0"

# Scientific
numpy = "^1.24.0"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"

# Data
pydantic = "^2.0.0"
loguru = "^0.7.0"
pyyaml = "^6.0"

# Optional: Rust extension
maturin = { version = "^1.0.0", optional = true }

[tool.poetry.extras]
rust = ["maturin"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.group.notebook.dependencies]
jupyter = "^1.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.15.0"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W"]
ignore = ["E501"]
