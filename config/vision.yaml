# Vision pipeline parameters
yolo:
  model: models/yolo/rok_ui_v8.pt
  imgsz: 640
  device: cpu
  half: false

ocr:
  engine: pytesseract
  lang: eng+vie
  use_gpu: false
  drop_score: 0.5

template:
  directory: models/templates
  threshold: 0.75
  method: TM_CCOEFF_NORMED

calibration:
  target_precision: 0.95
  per_class_thresholds: {}
