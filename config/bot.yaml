# Main bot configuration
project_name: rok-bot-engine
screenshot_interval_seconds: 2.0
max_retry_attempts: 3
stuck_threshold_seconds: 3600.0

vision:
  yolo_model_path: models/yolo/rok_ui_v8.pt
  confidence_threshold: 0.5
  ocr_lang: eng+vie

humanization:
  enabled: true
  # Set to true to enable session scheduling (work/evening/sleep hours with randomness).
  # When false, timing/movement/misclick humanization still works but bot won't random-sleep.
  schedule_enabled: false
  profile_path: null
  fatigue_half_life_hours: 2.0
  base_distraction_rate: 0.08
  base_misclick_rate: 0.01
  # Detailed timing/movement distributions are loaded from config/humanization.yaml.

pc:
  window_title: "Rise of Kingdoms"
  # Uncomment and adjust if your game window title is different (e.g., Vietnamese locale)
  # window_title: "Rise of Kingdoms"

actions:
  enabled_actions:
    - gather
    - rally_fort
    - alliance_help
    - scout
    - train_troops
    - reconnect
  priorities: {}
